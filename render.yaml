services:
  # ANGA FastAPI Backend — deployed on Render (free tier)
  # Docs: https://render.com/docs/render-yaml
  # Uses the same Dockerfile as every other environment (apps/backend/Dockerfile)
  # rather than Render's native Python buildpack, since that Dockerfile is the
  # only build path verified to compile Prophet's cmdstan toolchain correctly.
  - type: web
    name: anga-weather-api
    runtime: docker
    rootDir: apps/backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false       # Set this in Render dashboard → Environment
      - key: HF_TOKEN
        sync: false       # Optional — Earth-2 roadmap feature, falls back to Open-Meteo if unset
      - key: DATABASE_URL
        sync: false       # Neon/Supabase Postgres URL — falls back to local SQLite if unset
    healthCheckPath: /health
    autoDeploy: true      # Auto-redeploy on every GitHub push
