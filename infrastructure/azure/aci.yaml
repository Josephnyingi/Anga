apiVersion: 2021-10-01
location: japaneast
name: anga-cg
properties:
  containers:

    # ── Web (Flutter + Nginx) ─────────────────────────────────────────────
    - name: web
      properties:
        image: <ACR_LOGIN_SERVER>/anga-web:latest
        ports:
          - port: 80
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        environmentVariables:
          - name: NODE_ENV
            value: production

    # ── Backend (FastAPI) ─────────────────────────────────────────────────
    - name: backend
      properties:
        image: <ACR_LOGIN_SERVER>/anga-backend:latest
        ports:
          - port: 8000
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        environmentVariables:
          - name: API_HOST
            value: "0.0.0.0"
          - name: API_PORT
            value: "8000"
          - name: PYTHONPATH
            value: "."
          - name: PYTHONUNBUFFERED
            value: "1"
          # ── Secrets (fill these in before deploying) ──────────────────
          - name: GROQ_API_KEY
            secureValue: <GROQ_API_KEY>
          - name: HF_TOKEN
            secureValue: <HF_TOKEN>

  osType: Linux

  # ── Public URL ───────────────────────────────────────────────────────────
  # After deploy, URL will be:
  #   http://anga-weather.japaneast.azurecontainer.io       ← web app
  #   http://anga-weather.japaneast.azurecontainer.io/api/  ← API via nginx proxy
  #   http://anga-weather.japaneast.azurecontainer.io:8000/docs  ← Swagger UI (direct)
  ipAddress:
    type: Public
    dnsNameLabel: anga-weather
    ports:
      - protocol: TCP
        port: 80      # Web app (Flutter via Nginx)
      - protocol: TCP
        port: 8000    # Backend API direct access (Swagger docs)

  imageRegistryCredentials:
    - server: <ACR_LOGIN_SERVER>
      username: <ACR_USERNAME>
      password: <ACR_PASSWORD>

type: Microsoft.ContainerInstance/containerGroups
