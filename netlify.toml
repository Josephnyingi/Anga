# ANGA Web App — Netlify Deployment Configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# IMPORTANT — before deploying:
# 1. Run locally: cd apps/web && flutter build web --release
# 2. Commit the build output (apps/web/build/web/) to the repo
# 3. Deploy to Netlify — it will serve the static files below
# 4. Set ANGA_API_URL in Netlify dashboard → Environment Variables
#    to your Render backend URL e.g. https://anga-weather-api.onrender.com

[build]
  base    = "apps/web"
  publish = "build/web"
  command = "flutter build web --release --web-renderer html"

# Proxy /api/* → Render backend so the Flutter web app can call the API
# without any CORS issues (same-origin requests)
[[redirects]]
  from   = "/api/*"
  to     = "http://anga-weather.japaneast.azurecontainer.io:8000/:splat"
  status = 200
  force  = true

# Flutter web — send all routes to index.html (single-page app routing)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
