name: 🌟 Feature Branch CI

on:
  push:
    branches: [ 'feature/*', 'bugfix/*' ]
  pull_request:
    branches: [ develop ]

env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.16.0'

jobs:
  # 🔍 Quick Code Quality Check
  quick-quality-check:
    name: 🔍 Quick Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: 🎨 Code formatting (Black)
        run: |
          cd apps/backend
          black --check --diff .

      - name: 📋 Import sorting (isort)
        run: |
          cd apps/backend
          isort --check-only --diff .

      - name: 🔍 Linting (Flake8)
        run: |
          cd apps/backend
          flake8 .

      - name: 🔒 Security scanning (Bandit)
        run: |
          cd apps/backend
          bandit -r . -f json -o bandit-report.json || true

  # 🧪 Quick Backend Tests
  quick-backend-tests:
    name: 🧪 Quick Backend Tests
    runs-on: ubuntu-latest
    needs: quick-quality-check

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anga_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt

      - name: 🗄️ Set up test database
        run: |
          cd apps/backend
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'postgresql://postgres:postgres@localhost:5432/anga_test'
          from app.core.database import engine
          from app.models import Base
          Base.metadata.create_all(bind=engine)
          "

      - name: 🧪 Run unit tests
        run: |
          cd apps/backend
          pytest tests/unit/ -v --cov=app --cov-report=xml

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: apps/backend/coverage.xml
          flags: feature-branch
          name: feature-coverage

  # 📱 Quick Mobile Tests
  quick-mobile-tests:
    name: 📱 Quick Mobile Tests
    runs-on: ubuntu-latest
    needs: quick-quality-check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐧 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 📦 Install Flutter dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: 🔍 Analyze Flutter code
        run: |
          cd apps/mobile
          flutter analyze

      - name: 🧪 Run Flutter tests
        run: |
          cd apps/mobile
          flutter test --coverage

      - name: 📊 Upload Flutter coverage
        uses: codecov/codecov-action@v3
        with:
          file: apps/mobile/coverage/lcov.info
          flags: feature-mobile
          name: feature-mobile-coverage

  # 🚀 Deploy to Feature Environment
  deploy-feature:
    name: 🚀 Deploy to Feature Environment
    runs-on: ubuntu-latest
    needs: [quick-backend-tests, quick-mobile-tests]
    if: github.event_name == 'push'
    environment: feature

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🚀 Deploy to feature environment
        run: |
          echo "🚀 Deploying feature branch to feature environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your feature deployment commands here
          # Example: docker-compose -f docker-compose.feature.yml up -d

      - name: 🧪 Run feature smoke tests
        run: |
          echo "🧪 Running smoke tests on feature environment..."
          # Add smoke tests here

  # 📊 Performance Baseline Check
  performance-baseline:
    name: 📊 Performance Baseline Check
    runs-on: ubuntu-latest
    needs: [quick-backend-tests, quick-mobile-tests]
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install performance tools
        run: |
          pip install pytest-benchmark

      - name: 🚀 Start backend
        run: |
          cd apps/backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: 📊 Run performance baseline tests
        run: |
          cd apps/backend
          pytest tests/performance/ -v --benchmark-only

      - name: 📈 Upload performance baseline
        uses: actions/upload-artifact@v3
        with:
          name: performance-baseline-${{ github.ref_name }}
          path: apps/backend/.benchmarks/
