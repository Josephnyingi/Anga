name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.41.6'

jobs:
  # Backend: fast syntax/lint check only. There's no backend test suite yet
  # (no tests/ directory), so this doesn't pretend to run one.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install lint tools
      run: |
        pip install flake8

    - name: Lint with Flake8 (errors only)
      run: |
        cd apps/backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Mobile app: analyze, run the real test files that exist, build debug APK.
  mobile-build:
    name: Mobile App Tests & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Get Flutter dependencies
      run: |
        cd apps/mobile
        flutter pub get

    - name: Analyze Flutter code
      run: |
        cd apps/mobile
        flutter analyze --no-fatal-infos --no-fatal-warnings

    - name: Run Flutter tests
      run: |
        cd apps/mobile
        flutter test

    - name: Build Android APK (debug)
      run: |
        cd apps/mobile
        flutter build apk --debug

  # Web app: build only (no test files here yet).
  web-build:
    name: Web App Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Get Flutter dependencies
      run: |
        cd apps/web
        flutter pub get

    - name: Build web
      run: |
        cd apps/web
        flutter build web --release
