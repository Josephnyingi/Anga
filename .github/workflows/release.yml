name: 🚀 Release Pipeline

on:
  push:
    branches: [ 'release/*' ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.16.0'

jobs:
  # 🔍 Release Quality Check
  release-quality-check:
    name: 🔍 Release Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: 🎨 Code formatting (Black)
        run: |
          cd apps/backend
          black --check --diff .

      - name: 📋 Import sorting (isort)
        run: |
          cd apps/backend
          isort --check-only --diff .

      - name: 🔍 Linting (Flake8)
        run: |
          cd apps/backend
          flake8 .

      - name: 🔒 Security scanning
        run: |
          cd apps/backend
          bandit -r . -f json -o bandit-report.json
          safety check --json --output safety-report.json

      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: release-security-reports
          path: |
            apps/backend/bandit-report.json
            apps/backend/safety-report.json

  # 🧪 Comprehensive Testing
  comprehensive-tests:
    name: 🧪 Comprehensive Testing
    runs-on: ubuntu-latest
    needs: release-quality-check

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anga_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt

      - name: 🗄️ Set up test database
        run: |
          cd apps/backend
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'postgresql://postgres:postgres@localhost:5432/anga_test'
          from app.core.database import engine
          from app.models import Base
          Base.metadata.create_all(bind=engine)
          "

      - name: 🧪 Run unit tests
        run: |
          cd apps/backend
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html

      - name: 🔗 Run integration tests
        run: |
          cd apps/backend
          pytest tests/integration/ -v

      - name: 🧪 Run end-to-end tests
        run: |
          cd apps/backend
          pytest tests/e2e/ -v

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: apps/backend/coverage.xml
          flags: release
          name: release-coverage

      - name: 📈 Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: release-test-results
          path: |
            apps/backend/htmlcov/
            apps/backend/coverage.xml

  # 📱 Mobile Release Testing
  mobile-release-tests:
    name: 📱 Mobile Release Testing
    runs-on: ubuntu-latest
    needs: release-quality-check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐧 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 📦 Install Flutter dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: 🔍 Analyze Flutter code
        run: |
          cd apps/mobile
          flutter analyze

      - name: 🧪 Run Flutter tests
        run: |
          cd apps/mobile
          flutter test --coverage

      - name: 📊 Upload Flutter coverage
        uses: codecov/codecov-action@v3
        with:
          file: apps/mobile/coverage/lcov.info
          flags: release-mobile
          name: release-mobile-coverage

  # 🏗️ Build Release Artifacts
  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, mobile-release-tests]
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🐧 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 📦 Build backend Docker image
        run: |
          cd apps/backend
          docker build -t anga-backend:${{ github.sha }} .

      - name: 📱 Build Flutter APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: 📱 Build Flutter iOS (if on macOS)
        if: runner.os == 'macOS'
        run: |
          cd apps/mobile
          flutter build ios --release

      - name: 📊 Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push'
    environment: staging

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install deployment tools
        run: |
          pip install awscli docker-compose

      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying release to staging environment..."
          echo "Release branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your staging deployment commands here

      - name: 🧪 Run staging tests
        run: |
          echo "🧪 Running comprehensive tests on staging..."
          # Add staging tests here

  # 📊 Performance Testing
  performance-testing:
    name: 📊 Performance Testing
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, mobile-release-tests]
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install performance tools
        run: |
          pip install locust pytest-benchmark

      - name: 🚀 Start backend
        run: |
          cd apps/backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: 📊 Run performance tests
        run: |
          cd apps/backend
          pytest tests/performance/ -v --benchmark-only

      - name: 📈 Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: release-performance-results
          path: apps/backend/.benchmarks/

  # 🔒 Security Audit
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: release-quality-check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install security tools
        run: |
          pip install bandit safety semgrep

      - name: 🔍 Run security scan
        run: |
          cd apps/backend
          semgrep --config=auto --json --output=semgrep-report.json .
          bandit -r . -f json -o bandit-report.json
          safety check --json --output safety-report.json

      - name: 🛡️ Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: 📊 Upload security audit results
        uses: actions/upload-artifact@v3
        with:
          name: release-security-audit
          path: |
            apps/backend/semgrep-report.json
            apps/backend/bandit-report.json
            apps/backend/safety-report.json
            zap-report.html

  # 🚀 Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, performance-testing, security-audit]
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install deployment tools
        run: |
          pip install awscli docker-compose

      - name: 🚀 Deploy to production
        run: |
          echo "🚀 Deploying release to production environment..."
          echo "Release branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your production deployment commands here

      - name: 🧪 Run production health checks
        run: |
          echo "🧪 Running production health checks..."
          # Add health checks here

      - name: 📢 Notify team
        run: |
          echo "📢 Release deployed to production successfully!"
          # Add notification logic here

  # 🔄 Merge to Main and Develop
  merge-branches:
    name: 🔄 Merge to Main and Develop
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Merge to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout main
          git pull origin main
          git merge ${{ github.ref_name }}
          git push origin main

      - name: 🔄 Merge to develop
        run: |
          git checkout develop
          git pull origin develop
          git merge ${{ github.ref_name }}
          git push origin develop

      - name: 📢 Notify team of successful release
        run: |
          echo "📢 Release successfully merged to main and develop branches"
          # Add notification logic here
