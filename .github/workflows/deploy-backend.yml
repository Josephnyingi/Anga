name: Deploy Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'

jobs:
  build-and-deploy:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: angaweatheracr.azurecr.io
          username: angaweatheracr
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: angaweatheracr.azurecr.io/anga-backend:latest

      - name: Restart Azure Container Instance
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart container group
        run: |
          az container restart --name anga-cg --resource-group anga-rg
          echo "✅ Container restarted with new image"
