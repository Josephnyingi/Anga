<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ANGA Weather Web App - AI-powered weather forecasting and farming assistance">
  <title>ANGA Weather - AI-Powered Weather & Farming Assistant</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 18px;
      font-weight: 500;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    Loading ANGA Weather...
  </div>

  <script>
    // Configure Flutter for better CanvasKit compatibility
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://www.gstatic.com/flutter-canvaskit/",
      renderer: "html", // Use HTML renderer instead of CanvasKit to avoid GL issues
      debugShowCheckedModeBanner: false
    };

    window.addEventListener('load', function(ev) {
      // Use HTML renderer to avoid CanvasKit GL issues
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html" // Force HTML renderer
          }).then(function(appRunner) {
            document.getElementById('loading').style.display = 'none';
            appRunner.runApp();
          }).catch(function(error) {
            console.error('Flutter initialization failed:', error);
            document.getElementById('loading').innerHTML = 'Failed to load app. Please refresh.';
          });
        }
      });
    });
  </script>

  <!-- Load Flutter bootstrap which contains build configuration -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
