<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ANGA Weather Web Application - AI-Powered Weather & Farming Assistant">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ANGA Weather">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>ANGA Weather Web App</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ── ANGA Loading Splash ─────────────────────────────────── */
    #anga-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(160deg, #0D1B2A 0%, #0175C2 60%, #00A86B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease;
    }

    #anga-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      animation: splashFadeIn 0.8s ease forwards;
    }

    .splash-icon {
      font-size: 64px;
      line-height: 1;
      animation: splashPulse 2s ease-in-out infinite;
    }

    .splash-name {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 8px;
      color: white;
      text-transform: uppercase;
    }

    .splash-tagline {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      animation: splashFadeIn 1.2s ease forwards;
    }

    .splash-bar-wrap {
      width: 220px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
      animation: splashFadeIn 1.4s ease forwards;
    }

    .splash-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 4px;
      animation: splashLoad 3s ease forwards;
    }

    .splash-flags {
      font-size: 28px;
      letter-spacing: 8px;
      animation: splashFadeIn 1.6s ease forwards;
    }

    .splash-poweredby {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.45);
      position: absolute;
      bottom: 28px;
      text-transform: uppercase;
    }

    @keyframes splashFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    @keyframes splashLoad {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 78%; }
      90%  { width: 92%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ── Splash screen (shown while Flutter engine loads) ── -->
  <div id="anga-splash">
    <div class="splash-logo">
      <span class="splash-icon">🌤️</span>
      <span class="splash-name">ANGA</span>
    </div>
    <p class="splash-tagline">Weather forecasts and early-warning alerts for smallholder farmers</p>
    <div class="splash-bar-wrap">
      <div class="splash-bar"></div>
    </div>
    <p class="splash-flags">🇰🇪 🇺🇬</p>
    <p class="splash-poweredby">Powered by NVIDIA Earth-2 &nbsp;·&nbsp; Groq AI &nbsp;·&nbsp; Flutter</p>
  </div>

  <!-- Flutter initialisation (Flutter 3.22+ loader API) -->
  <script src="flutter.js" defer></script>
  <script defer>
    function removeSplash() {
      var splash = document.getElementById('anga-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() { splash.remove(); }, 700);
      }
    }

    // runApp() resolving only means Flutter's main() started, not that the
    // first frame has actually painted - fading the splash out right then
    // caused it to visibly overlap/bleed into the still-painting app
    // underneath, especially noticeable on mobile. Prefer the engine's own
    // first-frame signal; keep the runApp() chain as a fallback in case that
    // event isn't dispatched (removeSplash is idempotent either way).
    window.addEventListener('flutter-first-frame', removeSplash);

    window.addEventListener('load', function() {
      // flutter_bootstrap.js (generated at build time) sets _flutter.buildConfig
      // and calls _flutter.loader.load(). We intercept here to add splash removal.
      window._flutter = window._flutter || {};
      var _origInstall = Object.getOwnPropertyDescriptor(window._flutter, 'loader');
      function hookLoader(loader) {
        var origLoad = loader.load.bind(loader);
        loader.load = function(opts) {
          opts = opts || {};
          if (!opts.onEntrypointLoaded) {
            opts.onEntrypointLoaded = function(engineInitializer) {
              engineInitializer.initializeEngine().then(function(appRunner) {
                return appRunner.runApp();
              }).then(function() {
                setTimeout(removeSplash, 300);
              });
            };
          }
          return origLoad(opts);
        };
      }
      // Hook if loader already present, otherwise watch for it
      if (window._flutter.loader) {
        hookLoader(window._flutter.loader);
      } else {
        Object.defineProperty(window._flutter, 'loader', {
          set: function(l) { hookLoader(l); Object.defineProperty(window._flutter, 'loader', {value: l, writable: true, configurable: true}); },
          configurable: true
        });
      }

      // Fallback: hide splash after 10 seconds no matter what
      setTimeout(removeSplash, 10000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
