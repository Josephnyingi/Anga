name: anga_web
description: ANGA Weather Web Application - AI-Powered Weather & Farming Assistant
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.8
  page_transition: ^2.2.1
  flutter_markdown_plus: ^1.0.3
  google_fonts: ^6.2.1

  # HTTP & API
  http: ^1.3.0

  # Charts & Visualization
  fl_chart: ^1.0.0

  # Animations
  animate_do: ^4.2.0

  # Utilities
  intl: ^0.20.2
  flutter_typeahead: ^5.2.0
  shared_preferences: ^2.4.10

  # State Management
  provider: ^6.1.2

  # Image Handling
  cached_network_image: ^3.3.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
