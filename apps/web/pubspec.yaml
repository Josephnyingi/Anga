name: anga_web
description: ANGA Weather Web Application - AI-Powered Weather & Farming Assistant
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  http: ^1.1.0
  
  # Charts & Visualization
  fl_chart: ^0.65.0
  
  # Animations
  animate_do: ^3.1.0
  
  # Utilities
  intl: ^0.19.0
  flutter_typeahead: ^4.8.0
  shared_preferences: ^2.2.2
  
  # State Management
  provider: ^6.1.1
  
  # Image Handling
  cached_network_image: ^3.3.0
  
  # Connectivity
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
