[build]
  publish = "build/web"

# Proxy /api/* → Render backend (must come BEFORE the catch-all below)
[[redirects]]
  from   = "/api/*"
  to     = "https://anga-weather-api.onrender.com/:splat"
  status = 200
  force  = true

# Flutter SPA — all other routes → index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
